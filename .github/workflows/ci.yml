name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject (3.10) and the ceiling this was
        # developed on (3.13), plus the versions between.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -q

      - name: Check the citation gate directly
        # Redundant with the suite, and deliberately so: if the gate is
        # ever skipped or renamed, this step still fails the build.
        run: |
          python -c "
          from numeral_systems import sources, classroom
          assert not sources.uncited_claims(), sources.uncited_claims()
          assert not sources.orphan_supports(), sources.orphan_supports()
          unknown = [k for k in classroom.all_claim_keys()
                     if k not in sources.CLAIMS]
          assert not unknown, unknown
          print('citation gate: clean')
          "

      - name: Confirm SOURCES.md is current
        # The document is generated from the register. If someone edits the
        # register without regenerating, the build says so here rather than
        # letting the two drift apart.
        run: |
          python tools/generate_sources_doc.py > /tmp/SOURCES.generated.md
          diff -u docs/SOURCES.md /tmp/SOURCES.generated.md
